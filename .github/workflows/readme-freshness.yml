name: Skills Validation

# Skill metadata and README consistency only. Numerical and solver tests run in
# tests.yml (Package tests) with the package and its dependencies installed, so
# this job no longer duplicates them with a bare interpreter.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate README from the skill catalogue
        run: python scripts/update_readme.py

      - name: README is current
        run: git diff --exit-code README.md

      - name: Validate skill folders, skills.json and README
        run: python scripts/validate_skills.py
