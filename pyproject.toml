[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aipe-simulation-skills"
version = "0.2.0"
description = "Executable open-source simulation capabilities for AIPE: ngspice tool qualification and batch runner, raw-file parser, dual-active-bridge switching-circuit generator and a reusable waveform analysis engine."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AIPE contributors" }]
keywords = ["power electronics", "ngspice", "dual active bridge", "waveform analysis", "AIPE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "h5py>=3.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
plot = ["matplotlib>=3.7"]

[project.scripts]
aipe-sim = "aipe_simulation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aipe_simulation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "solver: executes a real external solver (ngspice); skipped when the solver is not installed",
]
