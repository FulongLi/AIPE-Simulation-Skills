name: Skills Validation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate README
        run: python3 scripts/update_readme.py

      - name: Check README is current
        run: git diff --exit-code README.md

      - name: Validate skills
        run: python3 scripts/validate_skills.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install open numerical example dependencies
        run: python -m pip install -r pe-python-control-analysis/requirements.txt

      - name: Install open circuit simulator
        run: sudo apt-get update && sudo apt-get install -y ngspice

      - name: Exercise numerical invariants and ngspice refinement
        run: python -m unittest discover -s tests -v
